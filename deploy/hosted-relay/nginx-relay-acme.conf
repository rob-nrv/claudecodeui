# /etc/nginx/conf.d/cloudcli-relay-acme.conf  (step 1: HTTP only, used to obtain the certificate)
# Replace RELAY_DOMAIN. Any other Host on port 80 is dropped.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name RELAY_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
