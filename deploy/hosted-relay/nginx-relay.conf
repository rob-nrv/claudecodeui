# /etc/nginx/conf.d/cloudcli-relay.conf. Replace RELAY_DOMAIN. Certbot adds the
# ssl_certificate lines (certbot --nginx -d RELAY_DOMAIN).
limit_req_zone $binary_remote_addr zone=relay_all:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=relay_secret:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=relay_conn:10m;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name RELAY_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name RELAY_DOMAIN;
    # ssl_certificate / ssl_certificate_key: managed by certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    limit_req zone=relay_all burst=60 nodelay;
    limit_conn relay_conn 40;

    # Guessable secrets: pairing code and node enrollment code.
    location = /api/remote-access/pair {
        limit_req zone=relay_secret burst=4 nodelay;
        limit_req_status 429;
        include /etc/nginx/cloudcli-relay-proxy.inc;
    }
    location = /api/runtime-node-link/enroll {
        limit_req zone=relay_secret burst=4 nodelay;
        limit_req_status 429;
        include /etc/nginx/cloudcli-relay-proxy.inc;
    }
    location / {
        include /etc/nginx/cloudcli-relay-proxy.inc;
    }
}
