org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
# Google's SDK build-tools aapt2 is x86_64-only; no aarch64 build exists and this
# device has no x86_64 emulation. Termux's aapt (pkg) ships an aarch64-native aapt2
# build that speaks the same daemon protocol, so point AGP at it directly.
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
